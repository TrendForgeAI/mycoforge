name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  evals:
    name: Evals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run eval suites
        run: bash evals/run-evals.sh
        env:
          MYCOFORGE_DIR: ${{ github.workspace }}
