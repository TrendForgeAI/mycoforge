name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine pre-release state
        id: state
        run: |
          TAG="${{ github.ref_name }}"
          if echo "$TAG" | grep -qE "\-(alpha|beta|rc)"; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "label=Pre-release" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "label=Stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"

          # Previous tag
          PREV_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | sort -V | grep -v "^${TAG}$" | tail -1)

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
            COMPARE=""
          else
            RANGE="${PREV_TAG}..HEAD"
            COMPARE="**Full Changelog:** https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          fi

          # Group commits by type
          FEATURES=$(git log $RANGE --pretty="format:- %s" | grep "^- feat" || true)
          FIXES=$(git log $RANGE --pretty="format:- %s" | grep "^- fix" || true)
          REFACTORS=$(git log $RANGE --pretty="format:- %s" | grep "^- refactor" || true)
          OTHERS=$(git log $RANGE --pretty="format:- %s" | grep -vE "^- (feat|fix|refactor)" || true)

          # Build notes
          NOTES=""
          [ -n "$FEATURES" ]  && NOTES="${NOTES}### Features\n${FEATURES}\n\n"
          [ -n "$FIXES" ]     && NOTES="${NOTES}### Bug Fixes\n${FIXES}\n\n"
          [ -n "$REFACTORS" ] && NOTES="${NOTES}### Refactoring\n${REFACTORS}\n\n"
          [ -n "$OTHERS" ]    && NOTES="${NOTES}### Chores & Docs\n${OTHERS}\n\n"
          [ -n "$COMPARE" ]   && NOTES="${NOTES}${COMPARE}"

          # Write to file (handles multiline)
          printf "%b" "$NOTES" > /tmp/release-notes.md
          echo "notes_file=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        run: |
          TAG="${{ github.ref_name }}"
          PRERELEASE=${{ steps.state.outputs.prerelease }}

          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "${{ steps.changelog.outputs.notes_file }}" \
              --prerelease
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "${{ steps.changelog.outputs.notes_file }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
