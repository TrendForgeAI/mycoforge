services:
  mycoforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mycoforge
    env_file:
      - path: .env
        required: false       # .env optional — Platforms injizieren Vars direkt
    volumes:
      - mycoforge_workspace:/workspace
      - mycoforge_claude:/mycoforge/claude
      - mycoforge_runtime:/mycoforge/runtime
      - ~/.ssh:/root/.ssh:ro
    networks:
      - mycoforge_network
    restart: unless-stopped
    stdin_open: true
    tty: true

  web-ui:
    build:
      context: ./apps/web-ui
      dockerfile: Dockerfile
    container_name: mycoforge-web-ui
    env_file:
      - path: .env
        required: false
    environment:
      - WORKSPACE_PATH=/workspace
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - mycoforge_workspace:/workspace:ro
    networks:
      - mycoforge_network
    restart: unless-stopped
    depends_on:
      - mycoforge

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mycoforge-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    env_file:
      - path: .env
        required: false
    network_mode: host
    restart: unless-stopped
    profiles:
      - tunnel

volumes:
  mycoforge_workspace:       # Projekte persistent
  mycoforge_claude:          # Claude Config + Credentials persistent (/mycoforge/claude)
  mycoforge_runtime:         # Traces + State persistent (/mycoforge/runtime)

networks:
  mycoforge_network:
    driver: bridge
