services:
  mycoforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mycoforge
    env_file:
      - path: .env
        required: false       # .env optional — Platforms injizieren Vars direkt
    environment:
      - WORKSPACE_PATH=/workspace
    volumes:
      - mycoforge_workspace:/workspace
      - mycoforge_claude:/mycoforge/claude
      - mycoforge_runtime:/mycoforge/runtime
      - ~/.ssh:/root/.ssh:ro
    networks:
      - mycoforge_network
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    stdin_open: true
    tty: true

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mycoforge-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    # Kein env_file — Token kommt via command-Substitution, nicht als Env-Var.
    # env_file würde den Token als CLOUDFLARE_TUNNEL_TOKEN in docker logs exponieren.
    network_mode: host
    restart: unless-stopped
    profiles:
      - tunnel

volumes:
  mycoforge_workspace:       # Projekte persistent
  mycoforge_claude:          # Claude Config + Credentials persistent (/mycoforge/claude)
  mycoforge_runtime:         # Traces + State persistent (/mycoforge/runtime)

networks:
  mycoforge_network:
    driver: bridge
